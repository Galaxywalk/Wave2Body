[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wave2body"
version = "0.1.0"
description = "Self-supervised mmWave patch tokens and body-part tokenized human pose estimation."
readme = "README.md"
requires-python = ">=3.10,<3.11"
license = { file = "LICENSE" }
authors = [{ name = "Wave2Body Authors" }]
dependencies = [
    "einops>=0.8,<1",
    "lmdb>=2.2,<2.3",
    "matplotlib>=3.10,<3.11",
    "msgpack>=1.1,<1.2",
    "numpy>=2.2,<2.3",
    "pandas>=2.3,<2.4",
    "pyyaml>=6.0,<7",
    "smplx>=0.1.28,<0.2",
    "tensorboard>=2.20,<2.21",
    "torch>=2.5,<2.6",
    "tqdm>=4.67,<5",
]

[dependency-groups]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
include = ["wave2body*"]

[tool.setuptools.package-data]
wave2body = ["configs/**/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
