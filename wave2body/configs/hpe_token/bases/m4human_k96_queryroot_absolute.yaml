# M4Human K96 Stage 2 practical absolute HPE-token base.
#
# This is the current query-root/trainable-translator route. It intentionally
# avoids inheriting from legacy attn-pool or point-mean root-head baselines.

base_config: m4human_k96_stage1.yaml

coord_transform: m4human_radar_absolute_z_shifted_queryroot_iwmean_root

root_head:
  architecture: query_attn
  attention_hidden_dim: 256
  attention_heads: 4
  num_query_tokens: 4
  hidden_dim: 256
  num_layers: 3
  dropout: 0.1
  use_centers: true
  point_stats_dim: 19
  prior_mode: point_intensity_weighted_mean
  residual_scale: 1.0

training:
  stage: absolute_root_head
  stage_display_name: Absolute Root Head
  metric_namespace: absolute_root_head
  run_name: m4human_hpe_token_p1_s2_k96_tokenonly_queryattn_pointiwmean_absolute_trainable_e25_bf16_bs1024_trainonly_tokenizers
  batch_size: 1024
  num_workers: 16
  lr: 5.0e-5
  min_lr: 1.0e-7
  freeze_mmwave_tokenizer: true
  freeze_token_translator: false
  freeze_vqvae: true
  translator_lr_mult: 1.0
  root_head_lr_mult: 6.0
  root_loss_weight: 1.0
  absolute_pose_loss_weight: 0.25
  pose_loss_weight: 1.0

evaluation:
  primary_metric: absolute_mpjpe
  diagnostic_metrics: [absolute_mpjpe, root_error, root_aligned_mpjpe, p_mpjpe]
  compute_p_mpjpe: true
  root_index: 0
  m4human_action_groups: true
