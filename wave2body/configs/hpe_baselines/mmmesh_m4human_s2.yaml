# mmMesh port on M4Human hist4, split s2.
#
# This recipe trains absolute MPJPE via the mmMesh SMPL-X decoder. The decoder
# uses mmMesh's root-XY locator plus the predicted translation z component as
# the absolute body translation, then supervises decoded 22-joint positions with
# M4Human radar-frame absolute joints.

random_seed: 43

baseline:
  name: mmmesh

dataset:
  name: m4human
dataset_path: dataset://m4human
coord_transform: m4human_radar_absolute_z_shifted_no_root_normalization

m4human:
  cached_root: dataset://m4human
  smplx_model_root: dataset://m4human/models
  split: s2
  frame_mode: hist4
  temporal_offsets: [-3, -2, -1, 0]
  temporal_window: 4
  normalize_z: true
  pose_source: param_joints
  random_sample_train: true
  intensity_scale: 1.0
  max_samples:
    train: null
    val: null
    test: null

data_format:
  n_points: 128
  merge_nframes: 4
  normalized: false
  input_root_normalized: false
  input_root_crop: false
  target_root_normalized: false
  radar_input_c: 4
  num_joints: 22

mmmesh:
  input_dim: 4
  keep_raw_dims: 4
  point_feature_dim: 24
  anchor_nsample: 8
  decode_translation_mode: root_xy_plus_translation_z
  body_decoder_config:
    enabled: true
    model_path: dataset://m4human/models
    model_type: smplx
    joint_count: 22
    return_vertices: false

mmmesh_loss:
  rotmat_weight: 0.0
  translation_weight: 0.0
  root_xy_weight: 0.1
  betas_weight: 0.0
  gender_weight: 0.0
  joints_weight: 1.0
  vertices_weight: 0.0
  gender_loss: hinge

training:
  stage: hpe_mmmesh
  run_name: m4human_mmmesh_s2_hist4_absmpjpe_e25_bf16_bs1024
  batch_size: 1024
  epochs: 25
  lr: 0.001
  optimizer: adam
  num_workers: 8
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 2
  amp: true
  precision: bf16
  tf32: true
  matmul_precision: high
  compile:
    enabled: false
  log_interval: 20
  seed: 43
  train_val_split:
    enabled: false
    val_split: val

evaluation:
  primary_metric: mpjpe_mm
  diagnostic_metrics: [mpjpe_mm, total_loss, joints_loss, root_xy_loss]
